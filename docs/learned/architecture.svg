" y="426" text-anchor="middle" font-size="11.5">kernels 12 params  ·  stack 1,137  ·  1,149 total</text><text class="lbl" x="442" y="444" text-anchor="middle" font-size="11">N = cells, any number · T = samples, one per frame · the model never sees which cell is which</text><rect class="g" x="28" y="473" width="11" height="11" rx="2" style="fill:#f5b74e;stroke:none"/><text class="lbl" x="45" y="482" text-anchor="start" font-size="11">Convolution</text><rect class="g" x="141" y="473" width="11" height="11" rx="2" style="fill:#e07b39;stroke:none"/><text class="lbl" x="158" y="482" text-anchor="start" font-size="11">Centre − surround (DoG)</text><rect class="g" x="332" y="473" width="11" height="11" rx="2" style="fill:#8bc34a;stroke:none"/><text class="lbl" x="350" y="482" text-anchor="start" font-size="11">MaxPool</text><rect class="g" x="419" y="473" width="11" height="11" rx="2" style="fill:#5b9bd5;stroke:none"/><text class="lbl" x="436" y="482" text-anchor="start" font-size="11">Mean over cells</text><rect class="g" x="558" y="473" width="11" height="11" rx="2" style="fill:#c0504d;stroke:none"/><text class="lbl" x="575" y="482" text-anchor="start" font-size="11">Concat</text><rect class="g" x="637" y="473" width="11" height="11" rx="2" style="fill:#9b8ec4;stroke:none"/><text class="lbl" x="654" y="482" text-anchor="start" font-size="11">GELU</text><rect class="g" x="704" y="473" width="11" height="11" rx="2" style="fill:#8e44ad;stroke:none"/><text class="lbl" x="721" y="482" text-anchor="start" font-size="11">Score / threshold</text></svg>
