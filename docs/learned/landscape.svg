<svg viewBox="0 0 900 566" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A six-cell map of coordination-detection methods in neuroscience. Columns are what a method emits: per-cell events, cell assemblies meaning which cells group together, and population events meaning when the group fired. Rows are how it decides: learned from data on top, hand-written rules below. Bottom left and bottom middle are crowded with classical work — thresholded transients, and the ICA, Promax, SGC, CORE, SVD, FIM-X and CAD assembly detectors. Bottom right holds the classical population-event detectors including the SCE rule, CICADA, LoCo, CoactDetect and the MEA network-burst methods, plus the coactivity frame gate that SGC, CORE and SVD each run before they can begin. Top left holds the learned per-cell methods CASCADE, DeepCINAC and the spikefinder entrants. The cell for learned assembly detection is empty — nobody trains a network to emit assembly membership. Top right, the learned population-event detectors, holds DOSED and SEED on sleep EEG, cnn-ripple on hippocampal LFP and SpikeNet on clinical EEG — four methods, none of them calcium imaging — and bugarach's centre-surround model, which is the only calcium-imaging entry and the only one whose ground truth is planted in simulation rather than labelled by an expert. Two notes sit outside the grid: autoMEA is learned but emits a classical detector's parameters rather than detections, and RADICaL is learned at the population level but emits a latent trajectory rather than discrete events.">
  <style>
    .lbl  { font-family: var(--sans, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif); fill: var(--muted, #5c6773); }
    .hd   { font-size: 13.5px; font-weight: 700; fill: var(--ink, #16202b); }
    .ax   { font-size: 12px; font-weight: 700; fill: var(--ink, #16202b); letter-spacing: .06em; }
    .it   { font-size: 12.5px; }
    .sub  { font-size: 10.5px; fill: var(--muted, #5c6773); opacity: .85; }
    .note { font-size: 11.5px; font-style: italic; }
    .cell { fill: var(--card, #fff); stroke: var(--rule, #d8dde3); stroke-width: 1; }
    .empty{ fill: none; stroke: var(--rule, #d8dde3); stroke-width: 1; stroke-dasharray: 5 4; }
    .ours { fill: none; stroke: var(--learned, #7a1f22); stroke-width: 2; }
    .oursT{ fill: var(--learned, #7a1f22); font-weight: 700; }
    .gate { fill: var(--truth, #1b7f3b); font-weight: 700; }
  </style>

  <!-- column headers -->
  <text class="lbl hd" x="270" y="34" text-anchor="middle">per-cell events</text>
  <text class="lbl sub" x="270" y="50" text-anchor="middle">which cell fired, and when</text>
  <text class="lbl hd" x="500" y="34" text-anchor="middle">cell assemblies</text>
  <text class="lbl sub" x="500" y="50" text-anchor="middle">which cells group together</text>
  <text class="lbl hd" x="742" y="34" text-anchor="middle">population events</text>
  <text class="lbl sub" x="742" y="50" text-anchor="middle">when the group fired</text>

  <!-- row + axis labels -->
  <text class="lbl ax" x="14" y="150">LEARNED</text>
  <text class="lbl ax" x="14" y="360">HAND-</text>
  <text class="lbl ax" x="14" y="376">WRITTEN</text>
  <text class="lbl sub" x="450" y="556" text-anchor="middle">what the method emits &#8594;</text>

  <!-- ================= top row: learned ================= -->
  <rect class="cell" x="152" y="62" width="230" height="176" rx="4"/>
  <text class="lbl it" x="168" y="86">CASCADE</text>
  <text class="lbl sub" x="168" y="101">Rupprecht 2021 &#183; [Ca]</text>
  <text class="lbl it" x="168" y="126">DeepCINAC</text>
  <text class="lbl sub" x="168" y="141">Denis 2020 &#183; [Ca]</text>
  <text class="lbl it" x="168" y="166">spikefinder entrants</text>
  <text class="lbl sub" x="168" y="181">Berens 2018 &#183; [Ca]</text>
  <text class="lbl sub" x="168" y="212">truth: simultaneous</text>
  <text class="lbl sub" x="168" y="226">electrophysiology</text>

  <rect class="empty" x="390" y="62" width="230" height="176" rx="4"/>
  <text class="lbl it" x="505" y="145" text-anchor="middle">&#8212; empty &#8212;</text>
  <text class="lbl sub" x="505" y="165" text-anchor="middle">nobody trains a network</text>
  <text class="lbl sub" x="505" y="180" text-anchor="middle">to emit assembly membership</text>

  <rect class="cell" x="628" y="62" width="256" height="176" rx="4"/>
  <text class="lbl it" x="644" y="86">DOSED</text>
  <text class="lbl sub" x="644" y="101">Chambon 2019 &#183; [EEG] sleep micro-events</text>
  <text class="lbl it" x="644" y="124">SEED</text>
  <text class="lbl sub" x="644" y="139">Tapia-Rivas 2024 &#183; [EEG] spindles</text>
  <text class="lbl it" x="644" y="162">cnn-ripple</text>
  <text class="lbl sub" x="644" y="177">Navas-Olive 2022 &#183; [LFP] ripples</text>
  <text class="lbl it" x="644" y="200">SpikeNet</text>
  <text class="lbl sub" x="644" y="215">Jing 2020 &#183; [EEG] epileptiform discharges</text>
  <text class="lbl sub" x="644" y="232">truth: expert labels &#183; none of them [Ca]</text>

  <!-- ours, straddling the boundary of that cell -->
  <rect class="ours" x="628" y="246" width="256" height="52" rx="4"/>
  <text class="lbl it oursT" x="644" y="268">bugarach &#183; centre&#8722;surround</text>
  <!-- Shortened 2026-08-28. At 48 characters this ran to x=915 — past its own box,
       which ends at 884, and past the viewBox at 900 — so it shipped clipped
       mid-word on the published landscape page. Found by tests/test_svg_labels.py
       the first time that guard ran, in a figure nobody was looking at. -->
  <text class="lbl sub" x="644" y="286">[Ca] &#183; planted truth, fitted per lab</text>

  <!-- ================= bottom row: hand-written ================= -->
  <rect class="cell" x="152" y="316" width="230" height="176" rx="4"/>
  <text class="lbl it" x="168" y="340">thresholded transients</text>
  <text class="lbl sub" x="168" y="355">static or noise-model dynamic</text>
  <text class="lbl sub" x="168" y="370">Romano 2017 &#183; [Ca]</text>
  <text class="lbl it" x="168" y="396">deconvolution</text>
  <text class="lbl sub" x="168" y="411">fast non-negative &#183; [Ca]</text>
  <text class="lbl sub" x="168" y="442">the input to a coordination</text>
  <text class="lbl sub" x="168" y="456">analysis, not its output</text>

  <rect class="cell" x="390" y="316" width="230" height="176" rx="4"/>
  <text class="lbl it" x="406" y="340">ICA-CS, ICA-MP</text>
  <text class="lbl sub" x="406" y="355">Lopes-dos-Santos &#183; [Ca] [spikes]</text>
  <text class="lbl it" x="406" y="378">Promax-MP, Promax-CS</text>
  <text class="lbl sub" x="406" y="393">Romano 2017 &#183; [Ca]</text>
  <text class="lbl it" x="406" y="416">SGC &#183; CORE &#183; SVD &#183; FIM-X</text>
  <text class="lbl sub" x="406" y="431">benchmarked by M&#246;lter 2018 &#183; [Ca]</text>
  <text class="lbl it" x="406" y="454">CAD / CADopti</text>
  <text class="lbl sub" x="406" y="469">Russo &amp; Durstewitz 2017 &#183; [spikes]</text>

  <rect class="cell" x="628" y="316" width="256" height="176" rx="4"/>
  <text class="lbl it" x="644" y="340">SCE coactivity vs shuffle</text>
  <text class="lbl sub" x="644" y="355">Cr&#233;pel 2007, Malvache 2016 &#183; [Ca]</text>
  <text class="lbl it" x="644" y="378">CICADA &#183; LoCo &#183; CoactDetect</text>
  <text class="lbl sub" x="644" y="393">ported and benchmarked here &#183; [Ca]</text>
  <text class="lbl it" x="644" y="416">MaxInterval &#183; logISI &#183; ISI_N</text>
  <text class="lbl sub" x="644" y="431">network bursts &#183; [MEA]</text>
  <text class="lbl it gate" x="644" y="456">the coactivity frame gate</text>
  <text class="lbl sub" x="644" y="471">SGC, CORE and SVD each run one first</text>

  <!-- the arrow: the frame gate is a precondition of the assembly column -->
  <defs>
    <marker id="ga" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--truth, #1b7f3b)"/>
    </marker>
  </defs>
  <!-- Routed BELOW the label row, not through it. The original curve
       `M 640 450 C 604 450 600 434 574 424` passed through the middle of
       "benchmarked by Mölter 2018 · [Ca]" (x 406-613, y 419-434) at (584.9, 429.1),
       so the connector read as underlining that label rather than pointing past it.
       Found 2026-08-28 by tests/test_svg_labels.py's stroke-vs-text check, which was
       written after the same class of defect turned up twice in architecture.svg. -->
  <path d="M 640 450 C 616 452 596 448 574 444" fill="none"
        stroke="var(--truth, #1b7f3b)" stroke-width="1.4" stroke-dasharray="4 3"
        marker-end="url(#ga)"/>

  <!-- notes outside the grid -->
  <text class="lbl note" x="152" y="516">autoMEA (Hernandes 2024) is learned, but emits a classical detector&#8217;s parameters &#8212; the MaxInterval call is still MaxInterval&#8217;s.</text>
  <text class="lbl note" x="152" y="534">RADICaL (Zhu 2022) is learned at the population level, but emits a latent trajectory rather than discrete events.</text>
</svg>
