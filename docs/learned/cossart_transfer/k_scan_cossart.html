      {"3e3c8dbc-ec70-4fdd-855e-232262d986ea":{"version":"3.9.2","title":"Bokeh Application","config":{"type":"object","name":"DocumentConfig","id":"p1479","attributes":{"notifications":{"type":"object","name":"Notifications","id":"p1480"}}},"roots":[{"type":"object","name":"panel.models.layout.Column","id":"p1481","attributes":{"name":"Column00765","stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 300px));\n  -webkit-mask-size: auto calc(min(50%, 300px));\n}",{"type":"object","name":"ImportedStyleSheet","id":"p1484","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/css/loading.css?v=1.9.3"}},{"type":"object","name":"ImportedStyleSheet","id":"p1904","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/css/listpanel.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p1482","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/bundled/theme/default.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p1483","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/bundled/theme/native.css"}}],"margin":0,"align":"start","children":[{"type":"object","name":"panel.models.markup.HTML","id":"p1485","attributes":{"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 300px));\n  -webkit-mask-size: auto calc(min(50%, 300px));\n}",{"id":"p1484"},{"id":"p1482"},{"id":"p1483"}],"margin":[5,10],"align":"start","text":"\n&amp;lt;div style=&amp;quot;font:13px/1.5 -apple-system,Segoe UI,sans-serif;color:#16202b;\n            max-width:70rem;margin:0 auto 0.5rem&amp;quot;&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;The same 531 rows, four ways of summarising them, and the peak\nmoves.&amp;lt;/b&amp;gt; `80b8db6` gave &amp;lt;i&amp;gt;&amp;quot;their per-slice median argmax is K=12&amp;quot;&amp;lt;/i&amp;gt; as the\nreason the cross-lab transfer was re-run at 12. Panel B is that statistic, and it\nis &amp;lt;b&amp;gt;16&amp;lt;/b&amp;gt; \u2014 reproducing what two blind reviewers computed\nindependently. The reason given for K=12 does not survive.&amp;lt;/p&amp;gt;\n\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;The number does, and not for the reason anyone wrote down.&amp;lt;/b&amp;gt; Three\naggregations of the same scan peak at 12: the pooled mean, the 10% trimmed mean,\nand the mean per-slice rank. Panel C is why that matters more than the count of\ncriteria on each side \u2014 resample the 59 recordings and ask each\ncriterion for its winner again. The median-based reading, the one that produces\n16, names the same K in only\n&amp;lt;b&amp;gt;47%&amp;lt;/b&amp;gt; of resamples. Mean per-slice\nrank names 12 in &amp;lt;b&amp;gt;83%&amp;lt;/b&amp;gt;.&amp;lt;/p&amp;gt;\n\n&amp;lt;table style=&amp;quot;border-collapse:collapse;font-size:12px;margin:0 0 0.8rem&amp;quot;&amp;gt;\n&amp;lt;tr style=&amp;quot;border-bottom:1px solid #c8d6e4&amp;quot;&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:left;padding-right:14px&amp;quot;&amp;gt;aggregation of coact_excess&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right;padding-right:14px&amp;quot;&amp;gt;argmax&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right&amp;quot;&amp;gt;holds under resampling&amp;lt;/th&amp;gt;&amp;lt;/tr&amp;gt;\n&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;&amp;lt;span style=&amp;#x27;color:#b03a48&amp;#x27;&amp;gt;&amp;amp;#9632;&amp;lt;/span&amp;gt; pooled median&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;K&amp;amp;nbsp;=&amp;amp;nbsp;16&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;47%&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;&amp;lt;span style=&amp;#x27;color:#1f6fb4&amp;#x27;&amp;gt;&amp;amp;#9632;&amp;lt;/span&amp;gt; pooled mean&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;K&amp;amp;nbsp;=&amp;amp;nbsp;12&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;80%&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;&amp;lt;span style=&amp;#x27;color:#2e8b57&amp;#x27;&amp;gt;&amp;amp;#9632;&amp;lt;/span&amp;gt; pooled 10% trimmed mean&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;K&amp;amp;nbsp;=&amp;amp;nbsp;12&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;77%&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;&amp;lt;span style=&amp;#x27;color:#7a4fa3&amp;#x27;&amp;gt;&amp;amp;#9632;&amp;lt;/span&amp;gt; mean per-slice rank&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;K&amp;amp;nbsp;=&amp;amp;nbsp;12&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;83%&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;\n&amp;lt;/table&amp;gt;\n\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;So the honest statement is neither 12 nor 16.&amp;lt;/b&amp;gt; Panel A is a broad\nnon-monotonic plateau in which four values of K sit inside a few percent of each\nother, and which one tops it is a decision about aggregation rather than a\nmeasurement. A third reviewer said exactly this and was right. The correction\nowed to &amp;lt;code&amp;gt;current_export.toml&amp;lt;/code&amp;gt;, the transfer README and\n&amp;lt;code&amp;gt;docs/MILESTONES.md&amp;lt;/code&amp;gt; is not &amp;lt;i&amp;gt;&amp;quot;12 should have been 16&amp;quot;&amp;lt;/i&amp;gt;; it is\nthat this scan
