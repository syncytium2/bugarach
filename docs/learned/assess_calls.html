;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;0.28&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;busy \u00b7 nothing&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;19.0 mHz&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;\u2014&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;70&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;6.14&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;busy \u00b7 12 planted&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;19.0 mHz&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;12&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;89&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;12&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;9.56&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;\n&amp;lt;/table&amp;gt;\n\n&amp;lt;p&amp;gt;The top two panels contain &amp;lt;b&amp;gt;no coordination at all&amp;lt;/b&amp;gt; \u2014 every ROI&amp;#x27;s train\nwas drawn on its own, so every call in them is a coincidence the rate-matched\nnull was supposed to account for. Judge whether they look different in kind from\nthe green ones in the third panel, which sit on events that are really there.&amp;lt;/p&amp;gt;\n\n&amp;lt;p style=&amp;quot;color:#5c6773&amp;quot;
