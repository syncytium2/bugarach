      {"c4448a8c-3384-44c3-a58c-daac1cc69c0c":{"version":"3.9.2","title":"Bokeh Application","config":{"type":"object","name":"DocumentConfig","id":"p1468","attributes":{"notifications":{"type":"object","name":"Notifications","id":"p1469"}}},"roots":[{"type":"object","name":"panel.models.layout.Column","id":"p1470","attributes":{"name":"Column00803","stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 300px));\n  -webkit-mask-size: auto calc(min(50%, 300px));\n}",{"type":"object","name":"ImportedStyleSheet","id":"p1473","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/css/loading.css?v=1.9.3"}},{"type":"object","name":"ImportedStyleSheet","id":"p1878","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/css/listpanel.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p1471","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/bundled/theme/default.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p1472","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/bundled/theme/native.css"}}],"margin":0,"align":"start","children":[{"type":"object","name":"panel.models.markup.HTML","id":"p1474","attributes":{"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 300px));\n  -webkit-mask-size: auto calc(min(50%, 300px));\n}",{"id":"p1473"},{"id":"p1471"},{"id":"p1472"}],"margin":[5,10],"align":"start","text":"\n&amp;lt;div style=&amp;quot;font:13px/1.5 -apple-system,Segoe UI,sans-serif;color:#16202b;\n            max-width:62rem;margin:0 auto 0.5rem&amp;quot;&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;An operating point is chosen at one background rate and quoted as though it\nheld across the axis.&amp;lt;/b&amp;gt; It does not. Same planted events throughout \u2014 same\ncount, same times, same recruitment \u2014 with only the field they sit in changing.\nThe dashed lines are the two &amp;lt;code&amp;gt;REGIMES&amp;lt;/code&amp;gt; endpoints, which are the\ninterquartile spread of &amp;lt;i&amp;gt;untreated&amp;lt;/i&amp;gt; slices rather than a treatment effect.&amp;lt;/p&amp;gt;\n\n&amp;lt;table style=&amp;quot;border-collapse:collapse;font-size:12px&amp;quot;&amp;gt;\n&amp;lt;tr style=&amp;quot;border-bottom:1px solid #c8d6e4&amp;quot;&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:left;padding-right:14px&amp;quot;&amp;gt;detector&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right;padding-right:14px&amp;quot;&amp;gt;F1 at quiet&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right;padding-right:14px&amp;quot;&amp;gt;F1 at busy&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right;padding-right:14px&amp;quot;&amp;gt;spread across grid&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right&amp;quot;&amp;gt;vs the bake-off&amp;#x27;s top gap&amp;lt;/th&amp;gt;&amp;lt;/tr&amp;gt;\n&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;&amp;lt;span style=&amp;#x27;color:#b03a48&amp;#x27;&amp;gt;&amp;amp;#9632;&amp;lt;/span&amp;gt; CoactDetect&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.710&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.628&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0.307&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;18&amp;amp;times;&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;&amp;lt;span style=&amp;#x27;color:#1f6fb4&amp;#x27;&amp;gt;&amp;amp;#9632;&amp;lt;/span&amp;gt; LoCo&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.681&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.659&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0.248&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;15&amp;amp;times;&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt;&amp;amp;#9632;&amp;lt;/span&amp;gt; binned SCE&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.353&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.373&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0.233&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;14&amp;amp;times;&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;&amp;lt;span style=&amp;#x27;color:#c9782a&amp;#x27;&amp;gt;&amp;amp;#9632;&amp;lt;/span&amp;gt; SPIKE-synch&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.379&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.444&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0.209&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;12&amp;amp;times;&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;&amp;lt;span style=&amp;#x27;color:#2e8b57&amp;#x27;&amp;gt;&amp;amp;#9632;&amp;lt;/span&amp;gt; rate+context&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.683&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.682&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0.115&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;7&amp;amp;times;&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;&amp;lt;span style=&amp;#x27;color:#7a4fa3&amp;#x27;&amp;gt;&amp;amp;#9632;&amp;lt;/span&amp;gt; locust&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.600&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.557&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0.092&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;5&amp;amp;times;&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;\n&amp;lt;/table&amp;gt;\n\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;The ranking does not survive it either&amp;lt;/b&amp;gt; (panel B). The best detector at\nthe quiet endpoint is &amp;lt;b&amp;gt;CoactDetect&amp;lt;/b&amp;gt;; at the busy endpoint it is\n&amp;lt;b&amp;gt;rate+context&amp;lt;/b&amp;gt; \u2014 and those two points are both regimes this project fits and\nreports at. One detector moves four places across the grid.&amp;lt;/p&amp;gt;\n\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Compare with the tolerance curve, which asked the same question and got the\nopposite answer.&amp;lt;/b&amp;gt; Five of six detectors were flat across\n&amp;lt;code&amp;gt;TOLERANCE_GRID&amp;lt;/code&amp;gt;, so the inherited 1.5&amp;amp;nbsp;s was granting slack nobody\nused and no comparison rested on it. Here the &amp;lt;i&amp;gt;smallest&amp;lt;/i&amp;gt; spread is\n5&amp;amp;times; the difference the\npublished bake-off asks readers to believe between its top two rows, so\n&amp;lt;code&amp;gt;describe_background&amp;lt;/code&amp;gt; refuses a bare F1 for every one of the six.&amp;lt;/p&amp;gt;\n\n&amp;lt;p style=&amp;quot;color:#5c6773&amp;quot;&amp;gt;3 seeds per point, base recording\n&amp;lt;code&amp;gt;baseline_quiet&amp;lt;/code&amp;gt;, matching tolerance 1.5&amp;amp;nbsp;s.\n&amp;lt;b&amp;gt;This measures and changes nothing:&amp;lt;/b&amp;gt; &amp;lt;code&amp;gt;REGIMES&amp;lt;/code&amp;gt; is untouched, no\noperating point moves, and &amp;lt;code&amp;gt;evaluate&amp;lt;/code&amp;gt; is unchanged.\n&amp;lt;code&amp;gt;tests/test_background_curve.py&amp;lt;/code&amp;gt; pins the curve against\n&amp;lt;code&amp;gt;evaluate&amp;lt;/code&amp;gt; where the grid meets a regime, so the two cannot drift.&amp;lt;/p&amp;gt;\n&amp;lt;/div&amp;gt;","disable_math":true}},{"type":"object","name":"GridPlot","id":"p1869","attributes":{"rows":null,"cols":null,"toolbar":{"type":"object","name":"Toolbar","id":"p1876","attributes":{"tools":[{"type":"object","name":"ToolProxy","id":"p1871","attributes":{"tools":[{"type":"object","name":"WheelZoomTool","id":"p1480","attributes":{"tags":["hv_created"],"renderers":"auto","zoom_together":"none"}},{"type":"object","name":"WheelZoomTool","id":"p1680","attributes":{"tags":["hv_created"],"renderers":"auto","zoom_together":"none"}}]}},{"type":"object","name":"SaveTool","id":"p1872"},{"type":"object","name":"ToolProxy","id":"p1873","attributes":{"tools":[{"type":"object","name":"PanTool","id":"p1530"},{"type":"object","name":"PanTool","id":"p1730"}]}},{"type":"object","name":"ToolProxy","id":"p1874","attributes":{"tools":[{"type":"object","name":"BoxZoomTool","id":"p1531","attributes":{"overlay":{"type":"object","name":"BoxAnnotation","id":"p1532","attributes":{"syncable":false,"line_color":"black","line_alpha":1.0,"line_width":2,"line_dash":[4,4],"fill_color":"lightgrey","fill
