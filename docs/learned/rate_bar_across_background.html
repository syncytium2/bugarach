t;&amp;lt;code&amp;gt;BenchResult.precision&amp;lt;/code&amp;gt; is &amp;lt;code&amp;gt;n_hit / n_scored&amp;lt;/code&amp;gt; and\ndeliberately &amp;lt;b&amp;gt;excludes&amp;lt;/b&amp;gt; the promiscuity probe \u2014 a block with nothing planted\nin it \u2014 because the probe is severe enough to dominate any precision it enters.\n&amp;lt;code&amp;gt;tools/probe_rate_mechanism.py&amp;lt;/code&amp;gt;, which produced forks \u00a73&amp;#x27;s evidence,\npools by hand as &amp;lt;code&amp;gt;n_hit / n_detected&amp;lt;/code&amp;gt;, which &amp;lt;b&amp;gt;includes&amp;lt;/b&amp;gt; it, under a\ndocstring saying it mirrors &amp;lt;code&amp;gt;bench.evaluate&amp;lt;/code&amp;gt;. It does not. That is the\nexact fork &amp;lt;code&amp;gt;pool_scores&amp;lt;/code&amp;gt;&amp;#x27; own docstring was written to stop \u2014 &amp;lt;i&amp;gt;&amp;quot;the\nrule for what counts forked in silence. Import this.&amp;quot;&amp;lt;/i&amp;gt; \u2014 reappearing in a tool\nwritten after it.&amp;lt;/p&amp;gt;\n\n&amp;lt;table style=&amp;quot;border-collapse:collapse;font-size:12px&amp;quot;&amp;gt;\n&amp;lt;tr style=&amp;quot;border-bottom:1px solid #c8d6e4&amp;quot;&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:left;padding-right:12px&amp;quot; rowspan=&amp;quot;2&amp;quot;&amp;gt;bg&amp;lt;br&amp;gt;mHz&amp;lt;/th&amp;gt;\n  &amp;lt;th colspan=&amp;quot;4&amp;quot; style=&amp;quot;text-align:center;padding-right:12px&amp;quot;&amp;gt;probe EXCLUDED\n    (&amp;lt;code&amp;gt;bench.evaluate&amp;lt;/code&amp;gt;)&amp;lt;/th&amp;gt;\n  &amp;lt;th colspan=&amp;quot;2&amp;quot; style=&amp;quot;text-align:center&amp;quot;&amp;gt;probe INCLUDED (forks \u00a73&amp;#x27;s tool)&amp;lt;/th&amp;gt;&amp;lt;/tr&amp;gt;\n&amp;lt;tr style=&amp;quot;border-bottom:1px solid #c8d6e4&amp;quot;&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right;padding-right:12px&amp;quot;&amp;gt;additive F1&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right;padding-right:12px&amp;quot;&amp;gt;its empty-block firings&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right;padding-right:12px&amp;quot;&amp;gt;mult. F1&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right;padding-right:12px&amp;quot;&amp;gt;its firings&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right;padding-right:12px&amp;quot;&amp;gt;additive F1&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right&amp;quot;&amp;gt;mult. F1&amp;lt;/th&amp;gt;&amp;lt;/tr&amp;gt;\n&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0&amp;#x27;&amp;gt;2.6&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.827&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @2&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;83&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.571&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @&amp;amp;alpha;=20&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.571&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;0.571&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0&amp;#x27;&amp;gt;5.2&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.769&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @2&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;92&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.700&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @&amp;amp;alpha;=16&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.636&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;0.700&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0&amp;#x27;&amp;gt;8.0&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.690&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @5&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;8&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.667&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @&amp;amp;alpha;=12&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.632&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;0.667&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0&amp;#x27;&amp;gt;12.0&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.675&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @5&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;10&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.600&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @&amp;amp;alpha;=8&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.602&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;0.600&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0&amp;#x27;&amp;gt;19.0&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.682&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @5&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;18&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.683&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @&amp;amp;alpha;=8&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.579&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;0.683&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0&amp;#x27;&amp;gt;28.0&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.627&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @5&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;20&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.520&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @&amp;amp;alpha;=5&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.532&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;0.520&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0&amp;#x27;&amp;gt;40.0&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.583&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @6&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;10&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.525&amp;lt;span style=&amp;#x27;color:#5c6773&amp;#x27;&amp;gt; @&amp;amp;alpha;=5&amp;lt;/span&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;0&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 12px 2px 0;text-align:right&amp;#x27;&amp;gt;0.512&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;0.525&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;\n&amp;lt;/table&amp;gt;\n\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;The inversion.&amp;lt;/b&amp;gt; With the probe excluded, multiplicative wins at\n&amp;lt;b&amp;gt;1 of 7&amp;lt;/b&amp;gt; points. With it included, &amp;lt;b&amp;gt;5 of\n7&amp;lt;/b&amp;gt;. Same runs, same knob grids, same seeds \u2014 only the rule for what\ncounts as a false positive differs.&amp;lt;/p&amp;gt;\n\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Panel B is why the probe-blind rule is not simply the right one.&amp;lt;/b&amp;gt; It picks\nadditive knobs that fire up to &amp;lt;b&amp;gt;92&amp;lt;/b&amp;gt; times in a block with\n&amp;lt;i&amp;gt;nothing planted in it&amp;lt;/i&amp;gt; (against multiplicative&amp;#x27;s 0), and its\nF1 cannot see that \u2014 which is\n&amp;lt;code&amp;gt;docs/todo/2026-08-16-promiscuity-probe-cannot-fail.md&amp;lt;/code&amp;gt; in action:\n&amp;lt;i&amp;gt;&amp;quot;its firings leave both numerator and denominator.&amp;quot;&amp;lt;/i&amp;gt; A campaign that selects\noperating points this way selects for promiscuity and cannot report it. &amp;lt;b&amp;gt;The\nrevision plan already says this must be fixed before the re-fit&amp;lt;/b&amp;gt;; this figure is\nwhat that warning looks like when you walk into it.&amp;lt;/p&amp;gt;\n\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;One asymmetry survives the open question, and it is the useful part.&amp;lt;/b&amp;gt;\nMultiplicative&amp;#x27;s two curves in panel A lie exactly on top of each other \u2014 its F1 is\n&amp;lt;b&amp;gt;the same number under both rules&amp;lt;/b&amp;gt;, because it never fires in the empty block\nand so the rules cannot disagree about it. Additive&amp;#x27;s two curves are\n0.255 apart at\ntheir widest. So whichever way the promiscuity question is settled, the\nmultiplicative bar&amp;#x27;s score does not move \u2014 which is a weaker claim than &amp;quot;it wins&amp;quot;\nand a much more robust one.&amp;lt;/p&amp;gt;\n\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;What the original question got, for what it is worth.&amp;lt;/b&amp;gt; The multiplicative\nbar&amp;#x27;s best &amp;amp;alpha; ranges &amp;lt;b&amp;gt;4.0&amp;amp;times;&amp;lt;/b&amp;gt; across the grid, so it is not\nbackground-invariant on this bench and there is no single &amp;amp;alpha; to calibrate \u2014\nunder either rule. Whatever else is true, forks \u00a73&amp;#x27;s &amp;lt;i&amp;gt;&amp;quot;switching the default\nbefore Phase 4 would ship an uncalibrated operating point&amp;quot;&amp;lt;/i&amp;gt; still holds.&amp;lt;/p&amp;gt;\n\n&amp;lt;p style=&amp;quot;color:#5c6773&amp;quot;&amp;gt;3 seeds per point, base recording\n&amp;lt;code&amp;gt;baseline_quiet&amp;lt;/code&amp;gt;, tolerance 1.5&amp;amp;nbsp;s. &amp;amp;alpha; over\n1.5&amp;amp;ndash;34; additive threshold over\n0.5&amp;amp;ndash;12&amp;amp;nbsp;Hz. Both mechanisms swept at\nevery point, so neither is credited a sweep the other did not get.\n&amp;lt;b&amp;gt;No default moves and no scorer is changed here&amp;lt;/b&amp;gt; \u2014 deciding how promiscuity\nenters the score is the open question this feeds.&amp;lt;/p&amp;gt;\n&amp;lt;/div&amp;gt;","disable_math":true}},{"type":"object","name":"GridPlot","id":"p1571","attributes":{"rows":null,"cols":null,"toolbar":{"type":"object","name":"Toolbar","id":"p1578","attributes":{"tools":[{"type":"object","name":"ToolProxy","id":"p1573","attributes":{"tools":[{"type":"object","name":"WheelZoomTool","id":"p1319","attributes":{"tags":["hv_created"],"renderers":"auto","zoom_together":"none"}},{"type":"object","name":"WheelZoomTool","id":"p1469","attributes":{"tags":["hv_created"],"renderers":"auto","zoom_together":"none"}}]}},{"type":"object","name":"SaveTool","id":"p1574"},{"type":"object","name":"ToolProxy","id":"p1575","attributes":{"tools":[{"type":"object","name":"PanTool","id":"p1361"},{"type":"object","name":"PanTool","id":"p1505"}]}},{"type":"object","name":"ToolProxy","id":"p1576","attributes":{"tools":[{"type":"object","name":"BoxZoomTool","id":"p1362","attributes":{"overlay":{"type":"object","name":"BoxAnnotation","id":"p1363","attributes":{"syncable":false,"line_color":"black","line_alpha":1.0,"line_width":2,"line_dash":[4,4],"fill_color":"lightgrey","fill_alpha":0.5,"level":"overlay","visible":false,"left":{"type":"number","value":"nan"},"right":{"type":"number","value":"nan"},"top":{"type":"number","value":"nan"},"bottom":{"type":"number","value":"nan"},"left_units":"canvas","right_units":"canvas","top_units"
