      {"4929d767-0b64-4585-bc7e-097a0ea6590e":{"version":"3.9.2","title":"Bokeh Application","config":{"type":"object","name":"DocumentConfig","id":"p1267","attributes":{"notifications":{"type":"object","name":"Notifications","id":"p1268"}}},"roots":[{"type":"object","name":"panel.models.layout.Column","id":"p1269","attributes":{"name":"Column00591","stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 300px));\n  -webkit-mask-size: auto calc(min(50%, 300px));\n}",{"type":"object","name":"ImportedStyleSheet","id":"p1272","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/css/loading.css?v=1.9.3"}},{"type":"object","name":"ImportedStyleSheet","id":"p1505","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/css/listpanel.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p1270","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/bundled/theme/default.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p1271","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.3/dist/bundled/theme/native.css"}}],"margin":0,"align":"start","children":[{"type":"object","name":"panel.models.markup.HTML","id":"p1273","attributes":{"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  mask-size: auto calc(min(50%, 300px));\n  -webkit-mask-size: auto calc(min(50%, 300px));\n}",{"id":"p1272"},{"id":"p1270"},{"id":"p1271"}],"margin":[5,10],"align":"start","text":"\n&amp;lt;div style=&amp;quot;font:13px/1.5 -apple-system,Segoe UI,sans-serif;color:#16202b;\n            max-width:60rem;margin:0 auto 0.5rem&amp;quot;&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Plant nothing, and the assessor still reports coordination.&amp;lt;/b&amp;gt; Every ROI&amp;#x27;s\ntrain here is drawn on its own \u2014 homogeneous Poisson, no shared process, no\ninjected event \u2014 so every co-active moment is a coincidence and the rate-matched\nnull is exactly the right model of what produced it. The green line at zero in\npanel A is where all three curves should sit. At the busy end of this project&amp;#x27;s\nown difficulty axis (19.0 mHz/ROI) the excess reads K=3: &amp;lt;b&amp;gt;6.50&amp;lt;/b&amp;gt; \u00b7 K=4: &amp;lt;b&amp;gt;1.54&amp;lt;/b&amp;gt; \u00b7 K=6: &amp;lt;b&amp;gt;0.00&amp;lt;/b&amp;gt;\nexcess co-active ROI\u00b7events per minute.&amp;lt;/p&amp;gt;\n\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Panel B is what it actually measures.&amp;lt;/b&amp;gt; The grey bar is the same\nestimator handed a circular shift of the same trains \u2014 by construction a draw\n&amp;lt;i&amp;gt;from&amp;lt;/i&amp;gt; the null it compares against, so it should read zero if the excess\nmeasures anything about the data. It reads almost what the recording reads:&amp;lt;/p&amp;gt;\n\n&amp;lt;table style=&amp;quot;border-collapse:collapse;font-size:12px&amp;quot;&amp;gt;\n&amp;lt;tr style=&amp;quot;border-bottom:1px solid #c8d6e4&amp;quot;&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:left;padding-right:14px&amp;quot;&amp;gt;background&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right;padding-right:14px&amp;quot;&amp;gt;the recording&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right;padding-right:14px&amp;quot;&amp;gt;a draw from the null&amp;lt;/th&amp;gt;\n  &amp;lt;th style=&amp;quot;text-align:right&amp;quot;&amp;gt;ratio&amp;lt;/th&amp;gt;&amp;lt;/tr&amp;gt;\n&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;quiet 5.2 mHz&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.28&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;0.09&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;34%&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;busy 19.0 mHz&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;6.14&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;5.91&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;96%&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;&amp;lt;tr&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0&amp;#x27;&amp;gt;crowded 50.0 mHz&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;30.09&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 14px 2px 0;text-align:right&amp;#x27;&amp;gt;28.88&amp;lt;/td&amp;gt;&amp;lt;td style=&amp;#x27;padding:2px 0;text-align:right&amp;#x27;&amp;gt;&amp;lt;b&amp;gt;96%&amp;lt;/b&amp;gt;&amp;lt;/td&amp;gt;&amp;lt;/tr&amp;gt;\n&amp;lt;/table&amp;gt;\n\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Why.&amp;lt;/b&amp;gt; &amp;lt;code&amp;gt;assess.py&amp;lt;/code&amp;gt; selects bins where the &amp;lt;i&amp;gt;observed&amp;lt;/i&amp;gt; count\nreaches K, then compares the observed against the null&amp;#x27;s &amp;lt;i&amp;gt;mean&amp;lt;/i&amp;gt; in those same\nbins. Selecting on the observed value guarantees it is high there; the null mean\nis the ensemble average and is not. The difference is positive by construction\nwhenever any bin reaches K, with or without coordination \u2014 the winner&amp;#x27;s curse,\nnot a measurement. More surrogates estimate the null mean better and do not\ntouch it.&amp;lt;/p&amp;gt;\n\n&amp;lt;p style=&amp;quot;color:#5c6773&amp;quot;&amp;gt;3 seeds per rate, 40 ROIs,\n30-minute window, 1 s bins, 200 surrogates; the band is\nthe seed range. &amp;lt;b&amp;gt;This measures and changes nothing:&amp;lt;/b&amp;gt;\n&amp;lt;code&amp;gt;assess_coactivity&amp;lt;/code&amp;gt; is held to 1e-9 against\n&amp;lt;code&amp;gt;measure_coordination_timescale.m&amp;lt;/code&amp;gt; and pari
