;/b&amp;gt; Measured on\n84 baseline recordings of\n&amp;lt;code&amp;gt;2026-09-17_revised_2v_long_STEPS_AND_PINS_EXCLUDED&amp;lt;/code&amp;gt;, 20 surrogate draws per recording.\nThe &amp;lt;b&amp;gt;coordinated share&amp;lt;/b&amp;gt; is the part of a cell&amp;#x27;s own firing rate that belongs to\nmoments shared with other cells; the &amp;lt;b&amp;gt;background rate&amp;lt;/b&amp;gt; is its total rate minus\nthat share. &amp;lt;b&amp;gt;Fixed&amp;lt;/b&amp;gt; and &amp;lt;b&amp;gt;binomial&amp;lt;/b&amp;gt; are the two models that bracket how many\ncells join a shared moment \u2014 pairs and triples fix the spread, not the mean.&amp;lt;/p&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Panel A \u2014 the calibration, and it is not uniform.&amp;lt;/b&amp;gt; Median relative error in the\nrecovered coordinated share on simulated recordings where the planted participants are\nknown; the band is the tool&amp;#x27;s own \u00b10.25 tolerance, and its &amp;lt;code&amp;gt;passed&amp;lt;/code&amp;gt;\nflag is decided on this quantity alone. Filled dots cleared it, hollow ones did not.\n&amp;lt;b&amp;gt;Slow clears every window; fast clears only 1 s&amp;lt;/b&amp;gt;, missing by +0.46 at\n2 s and +1.00 at 4 s. Fast&amp;#x27;s binomial case at 1 s clears by 0.002. So the\nfast numbers hold at exactly the window they were measured at, with no margin either\nside, and the slow ones travel.&amp;lt;/p&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Panel B \u2014 what adoption would move&amp;lt;/b&amp;gt;, bench value hollow, measured background\nfilled, log scale. Quiet and busy fall on both streams (14% to 35%). The probe splits:\n&amp;lt;b&amp;gt;fast would more than double&amp;lt;/b&amp;gt;, 0.060 \u2192 0.127 Hz,\nwhile &amp;lt;b&amp;gt;slow would barely move&amp;lt;/b&amp;gt;, 0.032 \u2192 0.029 Hz\n\u2014 but for opposite reasons, and that is the part worth reading twice.&amp;lt;/p&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;The coordination correction runs opposite ways with rate on the two streams.&amp;lt;/b&amp;gt;\nGoing from the raw rate to the background one costs fast \u22127.2% at quiet, \u221211.8% at busy\nand &amp;lt;b&amp;gt;\u22120.6% at the probe&amp;lt;/b&amp;gt;; it costs slow \u221211.5%, \u221225.4% and &amp;lt;b&amp;gt;\u221235.9%&amp;lt;/b&amp;gt;. So fast&amp;#x27;s\nbusiest stretches are not its coordinated ones and its probe move is purely a change of\n&amp;lt;i&amp;gt;definition&amp;lt;/i&amp;gt; \u2014 a measured 99th percentile of 300-second\nstretches in place of a chosen multiple of the median. Slow&amp;#x27;s busiest stretches &amp;lt;i&amp;gt;are&amp;lt;/i&amp;gt;\nits coordinated ones, so a third of its probe is the correction. Slow is also the stream\nwhose ungated calibration terms are weakest (its moment rate reads \u221222.8%), so that 36%\nis the number to check before anything rests on it.&amp;lt;/p&amp;gt;\n&amp;lt;/div&amp;gt;","disable_math":true}},{"type":"object","name":"GridPlot","id":"p1524","attributes":{"rows":null,"cols":null,"toolbar":{"type":"object","name":"Toolbar","id":"p1531","attributes":{"tools":[{"type":"object","name":"ToolProxy","id":"p1526","attributes":{"tools":[{"type":"object","name":"WheelZoomTool","id":"p1021","attributes":{"tags":["hv_created"],"renderers":"auto","zoom_together":"none"}},{"type":"object","name":"WheelZoomTool","id":"p1274","attributes":{"tags":["hv_created"],"renderers":"auto","zoom_together":"none"}}]}},{"type":"object","name":"SaveTool","id":"p1527"},{"type":"object","name":"ToolProxy","id":"p1528","attributes":{"tools":[{"type":"object","name":"PanTool","id":"p1079"},{"type":"object","name":"PanTool","id":"p1332"}]}},{"type":"object","name":"ToolProxy","id":"p1529","attributes":{"tools":[{"type":"object","name":"BoxZoomTool","id":"p1080","attributes":{"overlay":{"type":"object","name":"BoxAnnotation","id":"p1081","attributes":{"syncable":false,"line_color":"black","line_alpha":1.0,"line_width":2,"line_dash":[4,4],"fill_color":"lightgrey","fill_alpha":0.5,"le
