      {"c43027ec-bd80-4070-a40e-c1f7600dc058":{"version":"3.9.2","title":"Bokeh Application","config":{"type":"object","name":"DocumentConfig","id":"p1009","attributes":{"notifications":{"type":"object","name":"Notifications","id":"p1010"}}},"roots":[{"type":"object","name":"panel.models.layout.Column","id":"p1011","attributes":{"name":"Column00602","stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  width: calc(min(40px, 300px));\n  height: calc(min(40px, 300px));\n  mask-size: calc(min(40px, 300px)) calc(min(40px, 300px));\n  -webkit-mask-size: calc(min(40px, 300px)) calc(min(40px, 300px));\n}",{"type":"object","name":"ImportedStyleSheet","id":"p1014","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.4/dist/css/loading.css?v=1.9.4"}},{"type":"object","name":"ImportedStyleSheet","id":"p1605","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.4/dist/css/listpanel.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p1012","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.4/dist/bundled/theme/default.css"}},{"type":"object","name":"ImportedStyleSheet","id":"p1013","attributes":{"url":"https://cdn.holoviz.org/panel/1.9.4/dist/bundled/theme/native.css"}}],"margin":0,"align":"start","children":[{"type":"object","name":"panel.models.markup.HTML","id":"p1015","attributes":{"stylesheets":["\n:host(.pn-loading):before, .pn-loading:before {\n  background-color: #c3c3c3;\n  width: calc(min(40px, 300px));\n  height: calc(min(40px, 300px));\n  mask-size: calc(min(40px, 300px)) calc(min(40px, 300px));\n  -webkit-mask-size: calc(min(40px, 300px)) calc(min(40px, 300px));\n}",{"id":"p1014"},{"id":"p1012"},{"id":"p1013"}],"margin":[5,10],"align":"start","text":"\n&amp;lt;div style=&amp;quot;font-family:-apple-system,Segoe UI,sans-serif;max-width:1240px;\n            color:#16202b;line-height:1.45&amp;quot;&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Figure 1. What the estimator can carry, and what it would move.&amp;lt;/b&amp;gt; Measured on\n84 baseline recordings of\n&amp;lt;code&amp;gt;2026-09-17_revised_2v_long_STEPS_AND_PINS_EXCLUDED&amp;lt;/code&amp;gt;, 20 surrogate draws per recording.\nThe &amp;lt;b&amp;gt;coordinated share&amp;lt;/b&amp;gt; is the part of a cell&amp;#x27;s own firing rate that belongs to\nmoments shared with other cells; the &amp;lt;b&amp;gt;background rate&amp;lt;/b&amp;gt; is its total rate minus\nthat share. &amp;lt;b&amp;gt;Fixed&amp;lt;/b&amp;gt; and &amp;lt;b&amp;gt;binomial&amp;lt;/b&amp;gt; are the two models that bracket how many\ncells join a shared moment \u2014 pairs and triples fix the spread, not the mean.&amp;lt;/p&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Panel A \u2014 the calibration, which now clears everywhere.&amp;lt;/b&amp;gt; Median relative error in\nthe recovered coordinated share on simulated recordings where the planted participants are\nknown; the band is the tool&amp;#x27;s own \u00b10.25 tolerance, and its &amp;lt;code&amp;gt;passed&amp;lt;/code&amp;gt;\nflag is decided on this quantity alone. Filled dots cleared it, hollow ones did not.\n&amp;lt;b&amp;gt;All twelve cells clear it&amp;lt;/b&amp;gt; \u2014 both streams, both models, all three windows.&amp;lt;/p&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;They did not, until the probe stretch came out of the calibration.&amp;lt;/b&amp;gt; When the probe\nmoved to the measured 99th percentile, fast went from +0.06 to &amp;lt;b&amp;gt;+0.43&amp;lt;/b&amp;gt; and failed by\n1.7\u00d7 the tolerance; with the new backgrounds and the &amp;lt;i&amp;gt;old&amp;lt;/i&amp;gt; probe it reads +0.02, and\nwith no probe stretch at all, \u22120.17. &amp;lt;b&amp;gt;The backgrounds were never implicated.&amp;lt;/b&amp;gt; In the\nprobe window every cell lifts to the same rate across the same 300 s, and a joint rise in\nrate is indistinguishable from many shared moments to a statistic built on cumulants of the\npopulation count \u2014 while per-cell circular shifts break that rise up rather than preserving\nit, so the surrogates cannot subtract it either. \u26a0 The same effect runs on real recordings,\nso a baseline window with a busy stretch may be &amp;lt;b&amp;gt;slightly over-subtracted&amp;lt;/b&amp;gt;: bounded\nsmall on fast, where the share at the probe is 0.6% of the rate, and not obviously small on\nslow, where it is 35.9%.&amp;lt;/p&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;Panel B \u2014 what adoption would move&amp;lt;/b&amp;gt;, log scale. Three marks per column: the bench&amp;#x27;s\ncurrent value (hollow), this run&amp;#x27;s &amp;lt;b&amp;gt;raw&amp;lt;/b&amp;gt; rate (small grey square) and the\n&amp;lt;b&amp;gt;background&amp;lt;/b&amp;gt; rate it proposes (filled). Quiet and busy are measured on the bench&amp;#x27;s own\nrecording set \u2014 the 80 of 84 fast recordings\n(and 75 slow) that clear &amp;lt;code&amp;gt;fit_background_shape&amp;lt;/code&amp;gt;&amp;#x27;s floors,\nwhich is the set &amp;lt;code&amp;gt;remeasure_bench.py&amp;lt;/code&amp;gt; used to set &amp;lt;code&amp;gt;bench.REGIMES&amp;lt;/code&amp;gt;.&amp;lt;/p&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;The raw rates reproduce the bench, which is the reassuring part&amp;lt;/b&amp;gt;: fast quiet\n\u22123.0%, fast busy +0.2%, slow quiet +0.6%, slow busy +0.3%. So the grey square sits on the\nhollow circle, and the whole of the proposed change is the coordination subtraction \u2014\n&amp;lt;b&amp;gt;quiet and busy fall 13% to 22%&amp;lt;/b&amp;gt; \u2014 rather than any disagreement about the rate.\n&amp;lt;i&amp;gt;An earlier version of this figure measured quiet and busy over all 84 recordings and\nreported a 30% fall; that was the two recording sets differing, not a measurement.&amp;lt;/i&amp;gt;&amp;lt;/p&amp;gt;\n&amp;lt;p&amp;gt;&amp;lt;b&amp;gt;The probes are the exception, and they split.&amp;lt;/b&amp;gt; Raw \u2192 background costs fast\n&amp;lt;b&amp;gt;\u22120.6%&amp;lt;/b&amp;gt; at the probe against \u221216.5% at quiet, so fast&amp;#x27;s busiest stretches are not its\ncoordinated ones and its &amp;lt;b&amp;gt;+112%&amp;lt;/b&amp;gt; is purely a change of &amp;lt;i&amp;gt;definition&amp;lt;/i&amp;gt; \u2014 a measured\n99th percentile of 300-second stretches in place of a chosen\nmultiple of the median. Slow&amp;#x27;s costs &amp;lt;b&amp;gt;\u221235.9%&amp;lt;/b&amp;gt;: its busiest stretches &amp;lt;i&amp;gt;are&amp;lt;/i&amp;gt; its\ncoordinated ones, and its small net \u22129% is two large opposite moves cancelling. Slow is\nalso the stream whose ungated calibration terms are weakest (moment rate \u221227.4%), so that\n36% is the number to check before anything rests on it.&amp;lt;/p&amp;gt;\n&amp;lt;/div&amp;gt;","disable_math":true}},{"type":"object","name":"GridPlot","id":"p1596","attributes":{"rows":null,"cols":null,"toolbar":{"type":"object","name":"Toolbar","id":"p1603","attributes":{"tools":[{"type":"object","name":"ToolProxy","id":"p1598","attributes":{"tools":[{"type":"object","name":"WheelZoomTool","id":"p1021","attributes":{"tags":["hv_created"],"renderers":"auto","zoom_together":"none"}},{"type":"object","name":"WheelZoomTool","id":"p1274","attributes":{"tags":["hv_created"],"renderers":"auto","zoom_together":"none"}}]}},{"type":"object","name":"SaveTool","id":"p1599"},{"type":"object","name":"ToolProxy","id":"p1600","attributes":{"tools":[{"type":"object","name":"PanTool","id":"p1079"},{"type":"object","name":"PanTool","id":"p1344"}]}},{"type":"object","name":"ToolProxy","id":"p1601","attributes":{"tools":[{"type":"object","name":"BoxZoomTool","id":"p1080","attributes":{"overlay":{"type":"object","name":"BoxAnnotation","id":"p1081","attributes":{"syncable":false,"line_color":"black","line_alpha":1.0,"line_width":2,"line_dash":[4,4],"fill_color":"lightgrey","fill_alpha":0.5,"level":"overlay","visible":false,"left":{"type":"number","value":"nan"},"right":{"type":"number","value":"nan"},"top":{"type":"number","value":"nan"},"bottom":{"type":"number","value":"nan"},"left_units":"canvas","right_units"
