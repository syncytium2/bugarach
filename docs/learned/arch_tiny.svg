<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Signal path of the per-cell model: a rate-sorted raster of onsets is passed cell by cell through a shared four-layer dilated convolution stack that sees thirty-one samples, squashed by a sigmoid so each cell contributes at most about one, summed within four rate quantiles to give sixteen channels, and passed to a ten-layer dilated stack whose receptive field is two thousand and forty-seven samples, then a one-by-one layer that emits a score per frame. The cell dimension survives until the quantile pooling.">
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>

  <!-- stage boxes -->
  <rect x="6"   y="86" width="122" height="72" rx="3"/>
  <rect x="152" y="86" width="138" height="72" rx="3"/>
  <rect x="314" y="86" width="122" height="72" rx="3" class="act"/>
  <rect x="460" y="86" width="146" height="72" rx="3" class="act"/>
  <rect x="630" y="86" width="130" height="72" rx="3"/>
  <rect x="784" y="86" width="110" height="72" rx="3"/>

  <!-- stage titles -->
  <text x="67"  y="118" text-anchor="middle">raster</text>
  <text x="67"  y="137" text-anchor="middle">cells &#215; time</text>

  <text x="221" y="118" text-anchor="middle">per-cell filter</text>
  <text x="221" y="137" text-anchor="middle">4 conv, shared</text>

  <text x="375" y="118" text-anchor="middle" class="hi">sigmoid</text>
  <text x="375" y="137" text-anchor="middle">soft cap</text>

  <text x="533" y="118" text-anchor="middle" class="hi">pool in 4 rate bands</text>
  <text x="533" y="137" text-anchor="middle">sum within band</text>

  <text x="695" y="118" text-anchor="middle">dilated stack</text>
  <text x="695" y="137" text-anchor="middle">10 conv, 8 ch</text>

  <text x="839" y="118" text-anchor="middle">1&#215;1</text>
  <text x="839" y="137" text-anchor="middle">score per frame</text>

  <!-- what each stage buys, above -->
  <text x="67"  y="54" text-anchor="middle" class="lbl">sorted by rate</text>
  <text x="221" y="54" text-anchor="middle" class="lbl">one filter, every cell</text>
  <text x="375" y="54" text-anchor="middle" class="lbl hi">one cell, one vote</text>
  <text x="533" y="54" text-anchor="middle" class="lbl hi">the knob that matters</text>
  <text x="695" y="54" text-anchor="middle" class="lbl">must infer the background</text>
  <text x="839" y="54" text-anchor="middle" class="lbl">the six&#8217;s contract</text>

  <!-- the sigmoid caveat, sitting under the stage it qualifies -->
  <text x="375" y="70" text-anchor="middle" class="lbl">&#8212; approximately</text>

  <!-- shapes -->
  <text x="67"  y="181" text-anchor="middle" class="lbl">N &#215; T</text>
  <text x="221" y="181" text-anchor="middle" class="lbl">N &#215; 4 &#215; T</text>
  <text x="375" y="181" text-anchor="middle" class="lbl">N &#215; 4 &#215; T</text>
  <text x="533" y="181" text-anchor="middle" class="lbl">16 &#215; T</text>
  <text x="695" y="181" text-anchor="middle" class="lbl">8 &#215; T</text>
  <text x="839" y="181" text-anchor="middle" class="lbl">T</text>

  <!-- params -->
  <text x="221" y="198" text-anchor="middle" class="lbl">192 params</text>
  <text x="375" y="198" text-anchor="middle" class="lbl">0 params</text>
  <text x="533" y="198" text-anchor="middle" class="lbl">0 params</text>
  <text x="695" y="198" text-anchor="middle" class="lbl">2,192 params</text>
  <text x="839" y="198" text-anchor="middle" class="lbl">9 params</text>

  <!-- how far each filter can see -->
  <text x="221" y="215" text-anchor="middle" class="lbl">sees 31 samples</text>
  <text x="695" y="215" text-anchor="middle" class="lbl">sees 2,047 samples</text>

  <!-- flow -->
  <g fill="none" stroke-width="1.4" marker-end="url(#ah2)" color="inherit">
    <line x1="130" y1="122" x2="148" y2="122"/>
    <line x1="292" y1="122" x2="310" y2="122"/>
    <line x1="438" y1="122" x2="456" y2="122"/>
    <line x1="608" y1="122" x2="626" y2="122"/>
    <line x1="762" y1="122" x2="780" y2="122"/>
  </g>

  <!-- the cell axis, and where it ends. Anchored at the start for the same
       reason the tube figure is: centred, the string is wider than the room to
       its left and the first letters clip. -->
  <g stroke-width="1.1" fill="none" stroke-dasharray="3 3">
    <path d="M 67 231 L 67 245 L 436 245 L 436 231"/>
  </g>
  <text x="12" y="264" text-anchor="start" class="lbl">
    the cell dimension survives to here &#8212; pooling by rate band is what consumes it
  </text>

  <text x="450" y="288" text-anchor="middle" class="lbl">
    N = cells (any number) &#183; T = samples, 0.1 s each &#183; 2,393 params &#183; nothing here is told what a second is &#8212; every width is in samples
  </text>
</svg>
