[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bugarach"
version = "0.0.1"
description = "Web port of interface2's explore_sce coordination viewer"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyspike"]

[tool.hatch.build.targets.wheel]
packages = ["src/bugarach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
