[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bugarach"
version = "0.0.1"
description = "Web port of interface2's explore_sce coordination viewer"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
]

[project.optional-dependencies]
ui = ["panel>=1.4", "holoviews>=1.18"]
docs = ["markdown>=3.5"]
dl = ["torch>=2.0"]
dev = ["pytest>=8", "pyspike", "panel>=1.4", "holoviews>=1.18", "markdown>=3.5"]

[project.scripts]
bugarach = "bugarach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bugarach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
