[build-system]
# FLOOR, NOT DECORATION. `license` as a string and `license-files` as an array below are
# PEP 639, which hatchling only understands from 1.27. Unpinned, a clean build environment
# is free to resolve something older, and on 2026-09-03 CI's 3.14 leg did exactly that and
# died in the Install step with `Field 'project.license-files' must be a table` — a metadata
# error blamed on this file, which had not changed since 2026-08-11. Bisected: 1.21.0 and
# 1.25.0 reject it, 1.27.0 accepts. The floor turns a confusing build-backend error into a
# resolver refusal that names the real constraint.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bugarach"
version = "0.1.0"
description = "Web port of interface2's explore_sce coordination viewer"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",
]

[project.optional-dependencies]
ui = ["panel>=1.4", "holoviews>=1.18"]
docs = ["markdown>=3.5"]
dl = ["torch>=2.0"]
dev = ["pytest>=8", "pyspike", "panel>=1.4", "holoviews>=1.18", "markdown>=3.5",
       "playwright>=1.40", "torch>=2.0"]

[project.scripts]
bugarach = "bugarach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bugarach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
