name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push to a PR branch makes the run still going on that branch worthless, and before this
# block it ran to the end anyway: detector-review-doc pushed five times in 25 minutes on
# 2026-09-16 and all five ran their full 13–18 minutes. Cancelled only on pull requests, so
# every commit that lands on main keeps a finished result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only, and named rather than left to the default so a reader can see what CI
# is allowed to do. pull-requests: read is what tests/test_handoff_is_honest.py needs
# to ask whether the work a root HANDOFF.md claims is in flight has actually landed.
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          # tests/test_milestones_resolve.py asserts every commit a milestone row cites
          # is an ancestor of the base ref. The default depth-1 checkout carries no
          # history, so every historical sha reads as fabricated and the job goes red for
          # a reason that has nothing to do with the document. Two review roles predicted
          # this before it happened; it was filed as a residual and shipped anyway.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # pip's cache holds the wheels it BUILDS, not only the ones it downloads, and the
          # PySpike step below compiled pyspike from source for ~45s on every run. Downloads
          # were never the cost (torch's 196 MB wheel arrives in about a second). This does
          # not pin anything: pip still resolves the newest release each run, so CI keeps
          # meeting new versions of unpinned dependencies — which caching the installed
          # environment would have stopped.
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # torch comes from PyTorch's CPU wheel index, not PyPI. The PyPI default for
        # linux is the CUDA build: 527 MB of torch plus ~1 GB of nvidia-* runtime, per
        # matrix leg, none of which a GPU-less runner can ever load. The +cpu wheel is
        # 192 MB and pulls no CUDA at all. Scoped to its own `pip install` on purpose —
        # `--index-url` REPLACES PyPI, and the PyTorch index serves 403 for panel and
        # holoviews, so pointing the whole install at it breaks `[ui]`. Doing it in two
        # calls also avoids `--extra-index-url`, which would make pip search both
        # indexes for every package. Reasoning and revision conditions: ADR-0004.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # `surrogates` is Elephant, pinned: without it the surrogate screen's 98 tests
          # (tests/test_surrogates.py and its neighbours) skip, and a green tick here
          # would say nothing about the generators the screen measured.
          pip install -e ".[ui,dl,surrogates]" pytest pytest-xdist playwright
      - name: Install the browser the webapp tests drive
        # The viewer is JavaScript, so checking it means running it. Without a
        # browser here those tests SKIP rather than fail, which is the worst of
        # both: a green tick that has not looked at the webapp at all. The guard
        # in tests/test_browser_available.py fails loudly if this step stops
        # working, so it cannot go quiet again.
        run: python -m playwright install --with-deps chromium
      - name: Require the browser tests to actually run here
        run: echo "BUGARACH_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"
      - name: Require the learned-detector tests to actually run here
        # Third instance of the same guard, and the one that was missing longest.
        # `[dl]` was declared on 2026-08-17 in a README commit and never wired to
        # anything, so every test in tests/test_learn_nets.py collapsed into a single
        # "1 skipped" and pytest still exited 0. Eleven checks on the published tube
        # architecture, invisible behind a green tick. Same rule as the two guards
        # either side of this one: a guard that can go quiet is a tick that looked at
        # nothing.
        run: echo "BUGARACH_REQUIRE_TORCH=1" >> "$GITHUB_ENV"
      - name: Install PySpike (optional cross-check dependency)
        # source build; if unavailable on this Python the cross-check test skips
        run: pip install pyspike || echo "pyspike unavailable — cross-check test will skip"
      - name: Test
        # real-slice tests skip without BUGARACH_DATA_ROOT; everything else
        # (incl. all MATLAB-parity fixtures) runs on the committed synthetics
        #
        # GH_TOKEN, because tests/test_handoff_is_honest.py asks the API whether the
        # PRs a root HANDOFF.md names are still open, and `gh` with no token exits
        # non-zero — which that test reads as "no evidence" and turns into a skip. So
        # the check whose own docstring says it speaks "out loud, in CI" had never once
        # run in CI. github.token is read-only here and needs no repository secret.
        #
        # BUGARACH_REQUIRE_PR_API turns that skip into a failure, exactly as
        # BUGARACH_REQUIRE_BROWSER does for the browser step above: a guard that can go
        # quiet on its own is a green tick that looked at nothing. It only bites when a
        # root HANDOFF.md exists — rare, and precisely when the answer matters.
        #
        # -n auto, because this step was ~15 of each leg's ~17 minutes and ran on one core
        # of a runner that has four (public repositories get the 4-core runner). Setup —
        # pip, the browser, the PySpike build — is about two minutes, so caching it could
        # never have been the fix. Every server a test starts binds port 0.
        #
        # --dist loadfile, because the default hands out single tests and a file's tests
        # are not independent of each other. The webapp suites share one module-scoped
        # page and build on it in order: test_webapp_unchecked_generator.py aims the
        # generator in one test and the next two read that aim. On this change's first
        # CI run the default scheduler put those two on a worker whose page had never
        # been aimed, and 3.11 went red with `aimed_at: None` while 3.13 and 3.14 happened
        # to keep them together. loadfile keeps each file on one worker, in file order —
        # the order the suite was written against.
        #
        # -m serial runs AFTER, alone, and in file order. Two kinds of test cannot share
        # the machine or the checkout, and both were found by this change's own CI runs:
        #   - a wall-clock budget measures the other workers as much as the code. The
        #     briefing's 3-second budget read 3.1s on 3.11 with four workers loaded, and
        #     is absent from the 25 failed serial runs before this change. The budget is
        #     right for a session start and stays.
        #   - test_site_pages_render.py deletes and rebuilds the real site/, and
        #     test_site_withholding.py reads it. Serially the build always comes first;
        #     split, the reader's figure checks skipped on 3.13 and ran on 3.14 in the
        #     same run. -rs is what made that visible, and why it stays on.
        # If the marker ever matches nothing, pytest exits 5 and this step goes red
        # rather than quietly running zero tests.
        env:
          GH_TOKEN: ${{ github.token }}
          BUGARACH_REQUIRE_PR_API: "1"
        run: |
          echo "runner cores: $(nproc)"
          pytest -q -rs --durations=25 -n auto --dist loadfile -m "not serial"
          pytest -q -rs --durations=10 -m serial
