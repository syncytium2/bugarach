name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only, and named rather than left to the default so a reader can see what CI
# is allowed to do. pull-requests: read is what tests/test_handoff_is_honest.py needs
# to ask whether the work a root HANDOFF.md claims is in flight has actually landed.
permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # torch comes from PyTorch's CPU wheel index, not PyPI. The PyPI default for
        # linux is the CUDA build: 527 MB of torch plus ~1 GB of nvidia-* runtime, per
        # matrix leg, none of which a GPU-less runner can ever load. The +cpu wheel is
        # 192 MB and pulls no CUDA at all. Scoped to its own `pip install` on purpose —
        # `--index-url` REPLACES PyPI, and the PyTorch index serves 403 for panel and
        # holoviews, so pointing the whole install at it breaks `[ui]`. Doing it in two
        # calls also avoids `--extra-index-url`, which would make pip search both
        # indexes for every package. Reasoning and revision conditions: ADR-0004.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ui,dl]" pytest playwright
      - name: Install the browser the webapp tests drive
        # The viewer is JavaScript, so checking it means running it. Without a
        # browser here those tests SKIP rather than fail, which is the worst of
        # both: a green tick that has not looked at the webapp at all. The guard
        # in tests/test_browser_available.py fails loudly if this step stops
        # working, so it cannot go quiet again.
        run: python -m playwright install --with-deps chromium
      - name: Require the browser tests to actually run here
        run: echo "BUGARACH_REQUIRE_BROWSER=1" >> "$GITHUB_ENV"
      - name: Require the learned-detector tests to actually run here
        # Third instance of the same guard, and the one that was missing longest.
        # `[dl]` was declared on 2026-08-17 in a README commit and never wired to
        # anything, so every test in tests/test_learn_nets.py collapsed into a single
        # "1 skipped" and pytest still exited 0. Eleven checks on the published tube
        # architecture, invisible behind a green tick. Same rule as the two guards
        # either side of this one: a guard that can go quiet is a tick that looked at
        # nothing.
        run: echo "BUGARACH_REQUIRE_TORCH=1" >> "$GITHUB_ENV"
      - name: Install PySpike (optional cross-check dependency)
        # source build; if unavailable on this Python the cross-check test skips
        run: pip install pyspike || echo "pyspike unavailable — cross-check test will skip"
      - name: Test
        # real-slice tests skip without BUGARACH_DATA_ROOT; everything else
        # (incl. all MATLAB-parity fixtures) runs on the committed synthetics
        #
        # GH_TOKEN, because tests/test_handoff_is_honest.py asks the API whether the
        # PRs a root HANDOFF.md names are still open, and `gh` with no token exits
        # non-zero — which that test reads as "no evidence" and turns into a skip. So
        # the check whose own docstring says it speaks "out loud, in CI" had never once
        # run in CI. github.token is read-only here and needs no repository secret.
        #
        # BUGARACH_REQUIRE_PR_API turns that skip into a failure, exactly as
        # BUGARACH_REQUIRE_BROWSER does for the browser step above: a guard that can go
        # quiet on its own is a green tick that looked at nothing. It only bites when a
        # root HANDOFF.md exists — rare, and precisely when the answer matters.
        env:
          GH_TOKEN: ${{ github.token }}
          BUGARACH_REQUIRE_PR_API: "1"
        run: pytest -q
