# Which export folder is the input. ONE place, read by code — not prose.
#
# WHY THIS FILE EXISTS. On 2026-08-27 a session could not find the data and began
# re-deriving it from a `.mat` event store. The contract that forbids exactly that
# (`docs/export_folder_spec.md`, and "The export folder is the input. The store is
# closed." in CLAUDE.md) was correct, current, and in the repo the whole time.
#
# Tony's verdict on the fix that was offered — another line in CLAUDE.md:
#
#     "claude.md is unreliable. help me fix this permanently."
#
# He is right, and the evidence was already in the tree. Nothing *declared* which
# folder was current. It had to be triangulated from four places that did not agree
# about what they were even naming:
#
#     README.md:153                      `revised_2v_periods`      (abbreviated)
#     tests/test_io.py:588               `2026-08-18_..._periods`  (a test fixture)
#     docs/export_for_producers.md:200   "the current export"      (prose, undated)
#     docs/SESSIONS.md                   eight claim blocks, naming BOTH folders
#
# A session that does not already know the answer cannot get it from that set, and a
# session that guesses wrong reads the wrong data and reports numbers anyway. So the
# answer moved here, where `bugarach.dataset.current()` reads it and the PreToolUse
# gate `.claude/hooks/the-folder-is-the-input.sh` quotes it back at anyone reaching
# for a store.
#
# NAMES ONLY, NEVER PATHS. `dataset.resolve()` finds the folder under the data root
# on whatever machine this is; a path here would carry a person's name into a public
# repo and sapper SAP004 would block the commit. That is the correct outcome — the
# per-machine half of the answer is not a repo fact.
#
# WHEN THE PRODUCER SHIPS A NEW EXPORT: add a table for it, then point `default` at it.
# That one line is the whole change for every analysis; `tests/test_where_the_data_are.py`
# proves the named folders parse and that this file stays the only declaration.
#
# ONE DEFAULT, CONFIRMED EVERY SESSION (Tony, 2026-09-21: "there should be one default data
# folder that the user confirms at the start of every session"). Analyses call
# `dataset.default()`. Inside a Claude session it refuses until the person has confirmed
# this folder for this session (`python -m bugarach.dataset confirm`), so a change here is
# seen by a person before any analysis runs on it.
#
# EVERY TABLE SAYS WHAT IT IS FOR, in `use`:
#   input    — may be the default.
#   eval     — another corpus or a paired control, read on purpose and by name.
#   archive  — kept so earlier runs reproduce. `current()` refuses it unless
#              BUGARACH_REPRODUCE='<which run>' is set, so no analysis drifts onto it.
# A table with `parent` is a subset of that folder and inherits its contamination note —
# `ttx` and `senktide` carry all four pinned recordings of `steps_excluded` and until
# 2026-09-21 passed the contamination stop because their own notes did not repeat it.
#
# RESULTS CARRY THE NAME OF WHAT THEY WERE SCORED ON (`dataset.stamp()`), and
# `tools/check_scored_dataset.py` flags, at session start, every result scored on a folder
# other than the default.

default = "senktide_ttx"

