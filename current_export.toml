[steps_and_pins_excluded]
# The default from 2026-09-21 until 2026-09-23. Kept so the runs made on it reproduce.
use = "archive"
# The producer's 2026-09-17 export: field-step artifacts AND moco floor-pinned windows removed.
# `steps_excluded` below is kept so runs made before it reproduce, and it still stops an
# analysis by itself — see its note.
name = "2026-09-17_revised_2v_long_STEPS_AND_PINS_EXCLUDED"
recordings = 84
note = """
Answers the question this repository should have asked a week earlier. Non-rigid motion
correction (NoRMCorre, `boundary='copy'`) floods a textureless patch with a constant fill;
an ROI sitting there reports the frame minimum, and the detectors call events on the steps
into and out of it. The producer removed it rather than flagging it, and gives the reason
this repository reached independently: it is a CROSS-CELL artifact — on `20260629_312` four
ROIs pin over an identical 0-375 s span — so it manufactures near-simultaneous multi-ROI
structure that a rate-matched null cannot explain away.

Known contamination, and what this folder does about it: every event inside a pinned window
is REMOVED over the whole recording, and each one is listed in `moco_pinned_excluded.tsv`
(83 events, joinable on slice_id/roi/stream/time_sec, with `pin_window` grouping them by
block). The window is an ENVELOPE — first to last frame over the detector threshold — so it
takes some real events with the artifact, deliberately, in the conservative direction. Five
(roi, stream) blocks were emptied and appear as `time_sec = NA` rows; the ROI stays in the
population. The windows are human-confirmed: one panel per pinned ROI, raw F against the
frame minimum, reviewed by Tony. Census and method: interface2 `docs/moco_floor_pinning.md`.

Field steps are excluded here too, on the same rule as `steps_excluded`: every flagged event
removed over the whole recording, listed in `field_steps_excluded.tsv`.

84 recordings, 2,630 ROIs, 264,075 events, 238 regions. `20250731_149` is excluded by db4
`exclude == 1`, as in every sibling folder.

⚠ Four slices is a threshold, not the whole population, and the census says so itself
(`darkroom/sandbox_bakeoff/pinned_roi_census.csv`, 14 ROIs over 6 slices, cut at
`n_exceed >= 100`). Two slices sit below the cut and keep their events: `20260702_338`
(1 ROI, 13 exceeding frames) and `20260630_325` (1 ROI, 10), against 515 to 2,195 for the
four that were cleaned — two orders of magnitude weaker, measured rather than assumed. A
third, `20260629_314`, is absent from the census: a blind whole-frame scan by interface2 on
2026-09-02 ranks it beside the known four, along with `20250926_237` and `20260630_325`.

**Corrected 2026-09-22, and this paragraph said otherwise for four days.** It used to end
"the pinning detector has not been run over it … unexamined for one". **That is false, and
the producer withdrew it the day they wrote it** — see the same-day correction in their
answer, `<darkroom>/bugarach/archive/2026-09/2026-09-18-pinned-rois-answer/README.md`. All 85 archive
slices went through the per-ROI trace-derivative detector, these three included:
`20260630_325` came back **marginal** and is in the census (ROI 10, 3.6 s), with Tony
reviewing its trace panel himself; `20250926_237` and `20260629_314` came back with **no
ROI flagged**. So all three were screened, and two were cleared.

What is open is **sensitivity, not coverage**: the census tests manually selected hROIs
only, so a flooded patch holding no hROI leaves it silent while the frame is still
corrupted — which is what the whole-frame scan sees and the census cannot. `20260629_314`
is the most exposed case at 14 ROIs, the fewest of any DI slice. The producer's own reading
is that this **cuts in the consumer's favour**: a whole-frame artifact in a region with no
ROI in it cannot reach this event table at all. The test that would settle it is geometric —
pinned pixels against ROI masks, interface2's `tools/check_roi_pinning.m` — and **that** has
not been run on these three. Ask for that, not for the detector.

**ANSWERED 2026-09-22, and this closes it.** The geometric test ran on all three
(syncytium2/interface2#1; record: interface2 `docs/moco_floor_pinning.md`, *Update
2026-09-22*, `5d8aa49`). **The frames pin; the ROIs do not.** `20250926_237` shows no
pinned frames at 4,000 samples; `20260629_314` pins in 44 frames and `20260630_325` in
one, and in both the flooded patch lies where no ROI or penumbra sits, so it cannot
reach an extracted trace or this repository's event table. The known-pinned control
fired as expected. So the three candidates are not carrying pinned events, the
group-level scenario does not hold, and **nothing in this folder needs to change.**

The producer's own caveat travels with that: the geometric test undercounts — on the
control it caught 2 of the 4 census ROIs — so a clean result is not proof on its own.
What carries the conclusion is two tests sharing no code agreeing, the per-ROI trace
detector and the geometry. Their sampling note: 400 frames is too sparse to clear a
slice; the result above uses 4,000.
"""

[steps_excluded]
use = "archive"
# The producer's 2026-09-03 export with field-step artifacts REMOVED.
name = "2026-09-03_revised_2v_long_STEPS_EXCLUDED"
recordings = 84
note = """
Whole-field brightness steps GENERATE detections — onsets lock to the step, 74% (fast)
and 82% (slow) of ROIs fire at once, at 8.5x and 22.7x each slice's own rate, in both
streams. That is the signature a coordination detector exists to find, and it was in the
data. Nine steps confirmed by eye; every event within ±2 s of one removed (381 events,
9 slices), each listed in `field_steps_excluded.tsv`.

Pairs with `2026-09-03_revised_2v_long_PRE_ARTIFACT_KILLER`, which keeps the artifacts and
is on disk so the runs made before the removal stay reproducible. `slices.csv` and
`regions.csv` are byte-identical between the two, and the 75 unaffected recordings are
byte-identical once the two new columns are stripped — so the pair is a clean control.

Carries `analysis_start_sec` / `analysis_end_sec` (the `long_window_20` regime), which
`default` does not, plus two new per-event columns: `on_field_step` and `field_step_id`.

⚠ THE LOADER DROPS BOTH NEW COLUMNS SILENTLY. `io.py` recognises only width_sec /
width_def / peak_sec / amp beyond roi and time_sec, and `store.Stream` has no per-event
flag field, so `csv.DictReader` picks them up and they are discarded with no error. In
THIS folder that costs nothing — every surviving row reads `0` — but it is why the
FLAGGED_FOR_REVIEW companion cannot be read correctly here yet.

⚠ Known contamination this folder does NOT address: non-rigid motion correction pinned
12 ROIs to the frame floor across `20260629_312`, `20260629_309`, `20260630_316` and
`20250926_235`. Not flagged in any column. Producer's own caveat.
"""

