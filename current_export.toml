# Which export folder is the input. ONE place, read by code — not prose.
#
# WHY THIS FILE EXISTS. On 2026-08-27 a session could not find the data and began
# re-deriving it from a `.mat` event store. The contract that forbids exactly that
# (`docs/export_folder_spec.md`, and "The export folder is the input. The store is
# closed." in CLAUDE.md) was correct, current, and in the repo the whole time.
#
# Tony's verdict on the fix that was offered — another line in CLAUDE.md:
#
#     "claude.md is unreliable. help me fix this permanently."
#
# He is right, and the evidence was already in the tree. Nothing *declared* which
# folder was current. It had to be triangulated from four places that did not agree
# about what they were even naming:
#
#     README.md:153                      `revised_2v_periods`      (abbreviated)
#     tests/test_io.py:588               `2026-08-18_..._periods`  (a test fixture)
#     docs/export_for_producers.md:200   "the current export"      (prose, undated)
#     docs/SESSIONS.md                   eight claim blocks, naming BOTH folders
#
# A session that does not already know the answer cannot get it from that set, and a
# session that guesses wrong reads the wrong data and reports numbers anyway. So the
# answer moved here, where `bugarach.dataset.current()` reads it and the PreToolUse
# gate `.claude/hooks/the-folder-is-the-input.sh` quotes it back at anyone reaching
# for a store.
#
# NAMES ONLY, NEVER PATHS. `dataset.resolve()` finds the folder under the data root
# on whatever machine this is; a path here would carry a person's name into a public
# repo and sapper SAP004 would block the commit. That is the correct outcome — the
# per-machine half of the answer is not a repo fact.
#
# WHEN THE PRODUCER SHIPS A NEW EXPORT: change the name here and nowhere else.
# `tests/test_current_export.py` proves the named folders parse and that this file
# stays the only declaration.

[default]
# What an analysis reads unless it has a stated reason not to.
name = "2026-08-18_revised_2v_periods"
recordings = 84
note = """
The standard export. Two streams, region labels, and the full per-event set the
contract asks for — `time_sec` (t50rise), `width_sec` + `width_def`, `peak_sec`, `amp`.
Carries no `analysis_*` columns, deliberately.
"""

[pensub]
# The penumbra-subtracted pair, for the crosstalk control ONLY.
name = "2026-08-20_pensub_revised_2v"
recordings = 84
note = """
The same 84 recordings as `default`, penumbra-subtracted — verified file-for-file,
the two name sets are identical. That is what makes it usable as a crosstalk control:
the comparison is PAIRED, so a difference is the subtraction and not the roster.

It pairs with `default` above and NOT with `2026-08-17_revised_2v_v2`, which ships
different columns. Note that the underlying stores are 85 and 84 recordings and are
NOT the same set — the equality above is a fact about these two EXPORTS, checked
here, not inherited from the store counts. Do not carry the store figures across.
"""

[cossart]
# ANOTHER LAB'S DATA. Not ours, and not a control for ours — a second preparation.
name = "dandi_000219"
recordings = 59
note = """
The Cossart lab's published DANDI:000219, imported by `tools/import_dandi.py`: in vivo
two-photon CA1 in mouse pups, P5–P12. The first folder this project has read that it
did not produce. `check` passes on all 59.

⚠ **THE NAME IS AMBIGUOUS ON DISK, AND THE RESOLVER IS WHAT SETTLES IT.** The raw
download sits at `<data root>/dandi_000219`; the conforming export at
`<data root>/exports/external/dandi_000219`. The raw directory holds one CSV, so
`kind()` calls it an export folder and `require(want="export_folder")` accepts it — a
caller would silently analyse **1 recording instead of 59**, with every shape check
passing. `dataset.resolve()` searches the export directories before the bare root for
exactly that reason. Do not reorder that list.

⚠ **WHAT THIS CORPUS CANNOT DO.** It is binarised — an int8 raster of "active in this
frame", the authors' own inference — so there is no peak and no amplitude, and
`time_sec` is the rising edge of an active run, NOT a t50rise. Their `PROVENANCE.md`
documents the substitution and its cost: rates, counts and rankings are safe;
**cross-lab coincidence within a tolerance is not available from these files.** So a
comparison against our corpus lives in a SIMULATION parameterised from each corpus's
own statistics — never in matching their event times against ours.

⚠ **DO NOT TRANSPLANT OUR K.** Measured 2026-08-29 across both folders: our excess
peaks at K=3; theirs does not. Their slices carry ~405 ROIs against our ~34 and fire
about twice as fast per ROI, so at K=3 the rate-matched null already holds three
co-active cells and there is no excess left to find. The bar has to come from each
corpus's own null — which is what the Cossart lab's own SCE method does, and what
`sce.py` ports.
"""

