# real error: a consumer matched the lab's workbook on date alone (bugarach has no
# `slice_order`), dropped a recording the lab had NOT withdrawn, and every published
# number was then computed over a set one recording too small. Export contract
# revision 6 records it. If a folder looks wrong, that is a conversation with the
# producer, not a filter here.
